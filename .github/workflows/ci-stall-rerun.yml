name: CI stall auto-rerun

# Reruns a completed CI run's failed jobs ONCE when the run died of the
# runner-side checkout-stall class (a setup step dead at zero throughput
# until the job bound killed it, or until ci.yml's git low-speed abort
# failed it early). This is docs/merge-queue.md's own triage rule ("a rerun,
# not a code investigation") as automation for attempt 1; the decision
# predicate lives in scripts/lib/ci_stall_rerun.mjs and is pinned with the
# real incident fixtures by tests/ci_stall_rerun.test.ts.
#
# PERMISSIONS: every other workflow in this repository runs with
# contents: read only. This one departs, and each scope is load-bearing:
#   - actions: write is the rerun-failed-jobs call, the workflow's whole
#     point.
#   - checks: read fetches the killed job's annotations; the runner's
#     "exceeded the maximum execution time" annotation is what separates a
#     bound kill from a user or concurrency cancellation (a superseded PR
#     run cancelled mid-checkout is step-for-step identical and must never
#     be resurrected).
#   - contents: read checks out the decision scripts pinned to the DEFAULT
#     branch. A workflow_run workflow executes with write-capable
#     permissions, so it must never check out or run the triggering run's
#     PR-authored code; the triggering run's tree is only READ, via the
#     API, as data.
# No repository secrets are used, only the ephemeral github.token.
#
# Loop and masking safety (both re-verified inside the decision core, the
# job-level if below is only a cheap gate that keeps green runs from
# spinning a runner):
#   - only attempt 1 ever reruns, so the rerun's own completion event can
#     never rerun again; a second stall of the same job is the merge-queue
#     doc's "real slowdown, investigate" case and stays with a human.
#   - a rerun is only requested when NO test step ran anywhere in the run
#     (the dead step is a setup step and everything after it was skipped),
#     so a rerun can never mask a real test failure.
#
# workflow_run only fires for a workflow file present on the DEFAULT
# branch: this file is inert while it only exists on a release branch and
# arms at the next release-to-main merge (same rollout choreography as the
# merge-queue's required checks).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    name: Rerun stalled CI jobs once
    if: github.event.workflow_run.run_attempt == 1 && (github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'failure')
    # Three small API reads, one POST, no dependency install: minutes of
    # margin over a healthy run without ever holding a runner long.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out decision scripts
        uses: actions/checkout@v6
        with:
          # Pinned to the default branch explicitly: never the triggering
          # run's head, which would execute PR-authored code with this
          # workflow's write permissions.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      # The run id rides an env var, never a run-line interpolation, the
      # same hardened relay shape as ci.yml's selection inputs.
      - name: Decide and rerun once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ci_stall_rerun.mjs
