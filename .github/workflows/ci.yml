name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev-*'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull_request runs for the same PR. Group by event name plus
# PR number (or ref for pushes) so release/** pushes and other events stay
# isolated from ordinary PR traffic and cannot cancel each other (D4).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Two-tier i18n gate, split by git ref in this one file:
#
#   pr-gate       cheap, English-only-legal tier. Runs on pull requests, on pushes
#                 to non-release branches (main, dev-*), and on manual dispatch.
#                 It runs `npm test` WITHOUT I18N_RELEASE_TIER, so the release-only
#                 checks (s3_localized, copied-English rendered content, 21-locale
#                 key parity, empty-`pending`) are skipped. What it still enforces:
#                 registry-in-sync, s3_registered (every emit maps to a registered
#                 key/RULE), and placeholder parity for the translations that
#                 actually exist. An English-only PR (sparse overlay) passes here.
#                 The test suite runs as a 8-shard matrix (each shard executes a
#                 partition of the test files), so the job's wall time is the
#                 slowest shard, not the whole suite.
#
#   pr-checks     the PR tier's serialized checks (i18n freshness + coverage
#                 summary, malware gate, game/admin typecheck, env/server/client
#                 builds), split into their own job so they run in parallel with
#                 pr-gate and the PR critical path is max(tests, checks), not
#                 their sum. Same triggers as pr-gate.
#
#   release-gate  full 21-locale tier. Runs on release/** pushes and on the
#                 release-to-main PR merge result, with I18N_RELEASE_TIER=1. A merely
#                 `pending` (untranslated) key cannot survive this gate. Its test
#                 step runs the same 8-shard matrix as pr-gate; the serialized
#                 checks and builds run once, on shard 1 only.
#
# The release tier is a superset: its `npm test` runs every PR-tier check plus the
# release-only ones, and the release-gate job also typechecks and builds
# env/server/client serially in the one job.

jobs:
  release-version-gate:
    name: Release version gate
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version surfaces
        run: npm run release:check

  # Biome formatter + linter, adopted as a forward ratchet: only files actually
  # changed by this push/PR are checked (`--changed`), so the large existing tree
  # is never retroactively reformatted, while every new diff must pass format+lint.
  # `--no-errors-on-unmatched` keeps the job green when a change touches no
  # Biome-eligible file (docs, assets, generated i18n).
  lint:
    name: Format + lint (Biome, changed files)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # Default shallow checkout. Biome --changed --since only needs the base
        # commit object, which the next step fetches with --depth=1 when missing.
        # Full-history checkout was pure waste: it dominated the job wall time.
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zeros='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zeros" ]; then
            # Shallow checkout is tip-only; fetch the pre-push tip alone.
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            # New branch / missing before SHA: compare against default branch tip.
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
            echo "ref=origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Biome check (changed files only)
        env:
          BASE_REF_RESOLVED: ${{ steps.base.outputs.ref }}
        run: npx @biomejs/biome ci --changed --since="$BASE_REF_RESOLVED" --no-errors-on-unmatched

  browser-gate:
    name: Browser regressions (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version for cache key
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium browsers
        # Restores ~/.cache/ms-playwright when the Playwright version matches.
        # The install step always runs: on a hit it is a cheap no-op for the
        # browser download and only ensures OS deps; on a miss it downloads.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

  # The PR tier is two parallel jobs: pr-gate runs the test suite while pr-checks
  # runs the serialized checks, so the PR critical path is max(tests, checks)
  # instead of their sum. pr-gate additionally fans the suite across a 8-shard
  # matrix (vitest --shard: a sha1-hash partition of the test FILES), so its wall
  # time is the slowest shard. Locally `npm run gate` (scripts/gate.mjs) runs
  # the SAME combined step list serially with ONE full unsharded vitest run by
  # design (bounded workers); keep that script's step list in sync when adding
  # or removing a step in either job.
  pr-gate:
    name: PR gate (English-only legal)
    if: (github.event_name == 'pull_request' && (github.base_ref != 'main' || !startsWith(github.head_ref, 'release/'))) || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # fail-fast stays off: shards pass or fail independently, so one red shard
    # never cancels the others and a failure report always covers the whole
    # suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` regenerates the i18n artifacts itself (pretest) in EVERY
      # shard BY DESIGN (the S3 guard, guide freshness, and the git-subprocess
      # suites need the generated artifacts no matter which shard they hash
      # into), so this job needs no explicit i18n:gen step; the freshness diff
      # lives in pr-checks.
      # Full Sim suites are CPU-heavy. Keep each shard at half the runner's
      # available cores, matching the bounded local gate.
      - name: Run tests (PR tier, shard ${{ matrix.shard }} of 8)
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers="$(node -p 'Math.max(1, Math.floor(require("node:os").availableParallelism() / 2))')"

  # Runs in parallel with pr-gate: same if-condition, no needs edge in either
  # direction. The default pull_request merge-ref checkout MUST be preserved
  # here: the freshness diff checks the MERGE RESULT against the base branch,
  # not just the PR head.
  pr-checks:
    name: PR checks (freshness, typecheck, builds)
    if: (github.event_name == 'pull_request' && (github.base_ref != 'main' || !startsWith(github.head_ref, 'release/'))) || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n artifacts
        run: npm run i18n:gen

      # Post the coverage counts of the gitignored i18n.status.summary.json (written
      # by the i18n:gen step above) to the job summary as the out-of-band audit trail.
      - name: Post i18n coverage summary
        run: node scripts/i18n_coverage_summary.mjs

      # Fast, legible fail BEFORE the long build steps if a committed generated
      # artifact drifted from source (someone changed an overlay or a catalog key but
      # forgot to regenerate). The status registry and its counts summary are both
      # gitignored; the diff covers the committed line-item locale slices AND the
      # generated TranslationKey union. The test suite also enforces this, this just
      # surfaces it sooner.
      - name: Verify committed i18n artifacts are fresh
        run: git diff --exit-code -- src/ui/i18n.resolved.generated src/admin/i18n.resolved.generated src/ui/i18n.catalog/translation_keys.generated.ts

      # Release-gate malicious-code scan. The flagger is high-recall (most hits are
      # expected dev-tooling false positives), so this uses --gate: it fails only on
      # a HIGH-severity signature that survives the path-aware priors (a wallet
      # drainer, a hardcoded-credential auth bypass, an exfil channel, a planted
      # instruction-file injection). tests/malware_scan.test.ts asserts the same
      # inside `npm test`; this just surfaces it sooner and more legibly.
      - name: Malicious-code gate
        run: npm run security:gate

      - name: Typecheck
        run: npm run check:types

      - name: Build headless environment
        run: npm run build:env

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build

  release-gate:
    name: Release gate (full 21-locale)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    # The release tier; this single flag turns on every release-only check.
    env:
      I18N_RELEASE_TIER: '1'

    # The same 8-shard matrix as pr-gate: the test step partitions across the
    # eight runners, while every serialized check and build below carries a
    # single-shard condition so it runs exactly once (on shard 1) instead of
    # eight times. fail-fast stays off so shards report independently.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This job's checks also run locally as `npm run gate` (scripts/gate.mjs),
      # which stays serial with ONE full unsharded test run by design; keep that
      # script's step list in sync when adding or removing a step here.
      - name: Generate i18n artifacts
        if: matrix.shard == 1
        run: npm run i18n:gen

      # Fast, legible fail BEFORE the long test/build run if a committed generated
      # artifact drifted from source (someone changed an overlay or a catalog key but
      # forgot to regenerate). The status registry and its counts summary are both
      # gitignored; the diff covers the committed line-item locale slices AND the
      # generated TranslationKey union. The test suite also enforces this, this just
      # surfaces it sooner.
      - name: Verify committed i18n artifacts are fresh
        if: matrix.shard == 1
        run: git diff --exit-code -- src/ui/i18n.resolved.generated src/admin/i18n.resolved.generated src/ui/i18n.catalog/translation_keys.generated.ts

      # Post the coverage counts of the gitignored i18n.status.summary.json to the job summary as the out-of-band audit trail.
      - name: Post i18n coverage summary
        if: matrix.shard == 1
        run: node scripts/i18n_coverage_summary.mjs

      # Release-gate malicious-code scan (see the PR-gate job for the rationale).
      # --gate fails only on a HIGH-severity signature surviving the path-aware
      # priors; the full agent-judged pass is the `release-malware-audit` skill.
      - name: Malicious-code gate
        if: matrix.shard == 1
        run: npm run security:gate

      # Sharded like pr-gate; `npm test` (pretest) regenerates the i18n
      # artifacts in EVERY shard so the artifact-dependent suites pass no
      # matter which shard they hash into.
      # Full Sim suites are CPU-heavy. Keep each shard at half the runner's
      # available cores, matching the bounded local gate.
      - name: Run tests (release tier - 21-locale + empty-pending, shard ${{ matrix.shard }} of 8)
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers="$(node -p 'Math.max(1, Math.floor(require("node:os").availableParallelism() / 2))')"

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run check:types

      - name: Build headless environment
        if: matrix.shard == 1
        run: npm run build:env

      - name: Build server
        if: matrix.shard == 1
        run: npm run build:server

      - name: Build client
        if: matrix.shard == 1
        run: npm run build
